name: Build bisub APK

on:
  schedule:
    # Every 2 hours: probe the upstream heads and build only when they
    # moved. The probe costs one git ls-remote (~20 s, billed as 1 min);
    # an unchanged upstream skips the whole build job for free.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      client_ref:
        description: 'PipePipeClient branch/tag/commit to build from'
        required: false
        default: "b7cd5a34cfa5cbf52474dd075fe82e414d162fae"
      extractor_ref:
        description: 'PipePipeExtractor branch/tag/commit (must be compatible with the client ref)'
        required: false
        default: '73442076c671ae09bd5c0f9635932a5a67bdd609'

jobs:
  # Lightweight probe: resolves the upstream dev/main heads and compares
  # them with the .upstream-state file (written back by every scheduled
  # build). A scheduled run only proceeds to the build when something
  # actually moved upstream; manual dispatches skip the check entirely.
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      client_sha: ${{ steps.probe.outputs.client_sha }}
      extractor_sha: ${{ steps.probe.outputs.extractor_sha }}
    steps:
      - name: Checkout this patch project
        uses: actions/checkout@v6

      - name: Probe upstream heads
        id: probe
        run: |
          CLIENT_SHA=$(git ls-remote https://codeberg.org/NullPointerException/PipePipeClient.git dev | cut -f1)
          EXTRACTOR_SHA=$(git ls-remote https://codeberg.org/NullPointerException/PipePipeExtractor.git main | cut -f1)
          if [ -z "$CLIENT_SHA" ] || [ -z "$EXTRACTOR_SHA" ]; then
            # Network hiccup: treat as unchanged, the next run retries.
            echo "Probe failed, treating upstream as unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_CLIENT=$(grep '^client=' .upstream-state 2>/dev/null | cut -d= -f2)
          LAST_EXTRACTOR=$(grep '^extractor=' .upstream-state 2>/dev/null | cut -d= -f2)
          echo "client_sha=$CLIENT_SHA" >> "$GITHUB_OUTPUT"
          echo "extractor_sha=$EXTRACTOR_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CLIENT_SHA" = "$LAST_CLIENT" ] && [ "$EXTRACTOR_SHA" = "$LAST_EXTRACTOR" ]; then
            echo "Upstream unchanged (client ${CLIENT_SHA:0:10}), skipping the build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream moved (client ${LAST_CLIENT:0:10} -> ${CLIENT_SHA:0:10}, extractor ${LAST_EXTRACTOR:0:10} -> ${EXTRACTOR_SHA:0:10})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: github.event_name == 'workflow_dispatch' || needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout this patch project
        uses: actions/checkout@v6

      - name: Resolve upstream refs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "CLIENT_REF=${{ needs.check-upstream.outputs.client_sha }}" >> "$GITHUB_ENV"
            echo "EXTRACTOR_REF=${{ needs.check-upstream.outputs.extractor_sha }}" >> "$GITHUB_ENV"
          else
            echo "CLIENT_REF=${{ github.event.inputs.client_ref }}" >> "$GITHUB_ENV"
            echo "EXTRACTOR_REF=${{ github.event.inputs.extractor_ref }}" >> "$GITHUB_ENV"
          fi

      # PipePipeClient's settings.gradle contains includeBuild('../PipePipeExtractor'),
      # so BOTH repositories must be cloned side by side with their original names
      # under the same parent directory.
      - name: Clone upstream PipePipeClient
        run: |
          git clone https://codeberg.org/NullPointerException/PipePipeClient.git src/PipePipeClient
          cd src/PipePipeClient
          git checkout "$CLIENT_REF"

      - name: Clone upstream PipePipeExtractor
        run: |
          git clone https://codeberg.org/NullPointerException/PipePipeExtractor.git src/PipePipeExtractor
          cd src/PipePipeExtractor
          git checkout "$EXTRACTOR_REF"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Apply bisub patches (client)
        run: |
          cd src/PipePipeClient
          git config user.name "bisub-bot"
          git config user.email "bot@users.noreply.github.com"
          git am "$GITHUB_WORKSPACE"/patches/*.patch

      - name: Apply bisub patches (extractor)
        run: |
          cd src/PipePipeExtractor
          git config user.name "bisub-bot"
          git config user.email "bot@users.noreply.github.com"
          if ls "$GITHUB_WORKSPACE"/patches-extractor/*.patch >/dev/null 2>&1; then
            git am "$GITHUB_WORKSPACE"/patches-extractor/*.patch
          else
            echo "No extractor patches present, skipping"
          fi

      - name: Build debug APK
        working-directory: src/PipePipeClient
        run: ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pipepipe-bisub-apk
          path: src/PipePipeClient/app/build/outputs/apk/debug/*.apk

      - name: Create release (on success)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bisub-${{ github.run_number }}
          name: PipePipe bisub build ${{ github.run_number }}
          body: |
            PipePipe (${{ env.CLIENT_REF }}) + bisub patches.

            - PipePipeClient: ${{ env.CLIENT_REF }}
            - PipePipeExtractor: ${{ env.EXTRACTOR_REF }}
          files: src/PipePipeClient/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the built upstream state (scheduled builds only)
        if: github.event_name == 'schedule'
        run: |
          printf 'client=%s\nextractor=%s\n' "$CLIENT_REF" "$EXTRACTOR_REF" > .upstream-state
          git config user.name "bisub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .upstream-state
          git commit -m "Track upstream client ${CLIENT_REF:0:10} extractor ${EXTRACTOR_REF:0:10}"
          git push

  report-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Create issue about patch failure
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Patch application or build failed against upstream',
              body: `The bisub build failed. Either the patches no longer apply against the requested PipePipeClient/PipePipeExtractor ref, or the patched code has compile errors.\n\nCheck the run: ${runUrl}\n\nIf a patch failed to apply, the resolver/player hooks (0003/0005) most likely need a manual update — PipePipe refactors its player controllers frequently. See README for instructions. Extractor patches live in patches-extractor/ and must stay compatible with the client patches (0019+ remove four services on both sides).`,
              labels: ['patch-broken']
            });
